{% extends 'main/base.html' %}
{% load static %}

{% block title %}Пароль змінено{% endblock %}

{% block extra_css %}
<style>
  .content {
    margin-left: 180px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    height: 100vh;
  }
  .login-card {
    margin-right: 25%;
    margin-top: -50px;
    width: 600px;
    background: rgba(255, 220, 160, 0.70);
    border-radius: 20px;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
    overflow: hidden;
  }
  .login-header {
    background: #e3a64b;
    height: 75px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Oswald', sans-serif;
    font-size: 38px;
    font-weight: 600;
    color: #3a2a00;
  }
  .login-body {
    padding: 0px 40px 20px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .message-text {
    font-family: 'Ubuntu Mono', monospace;
    font-size: 22px;
    color: rgba(0, 0, 0, 0.75);
    line-height: 1.8;
    margin-bottom: 10px;
    text-align: center;
  }
  .login-btn {
    display: block;
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 20px;
    background: #2f5fa5;
    color: white;
    font-size: 24px;
    font-family: 'Oswald', sans-serif;
    cursor: pointer;
    text-decoration: none;
    text-align: center;
    transition: 0.2s ease;
    box-sizing: border-box;
  }
  .login-btn:hover {
    filter: brightness(1.1);
  }
</style>
{% endblock %}

{% block content %}
<main class="content">
  <div class="login-card">
    <div class="login-header">
      ПАРОЛЬ ЗМІНЕНО
    </div>
    <div class="login-body">
      <p class="message-text">Ваш пароль успішно змінено. Тепер ви можете увійти до свого акаунту.</p>
      <a href="{% url 'login' %}" class="login-btn">УВІЙТИ</a>
    </div>
  </div>
</main>
{% endblock %}
