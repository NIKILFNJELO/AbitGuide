{% extends 'main/base.html' %}
{% load static %}

{% block title %}Відновлення паролю{% endblock %}

{% block extra_css %}
<style>
  .content {
    margin-left: 180px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    height: 100vh;
  }
  .login-card {
    margin-right: 25%;
    margin-top: -50px;
    width: 600px;
    background: rgba(255, 220, 160, 0.70);
    border-radius: 20px;
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
    overflow: hidden;
  }
  .login-header {
    background: #e3a64b;
    height: 75px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    font-family: 'Oswald', sans-serif;
    font-size: 32px;
    font-weight: 600;
    color: #3a2a00;
  }
  .back-arrow {
    position: absolute;
    left: 24px;
    font-size: 32px;
    cursor: pointer;
    transition: 0.25s ease;
    color: #3a2a00;
    text-decoration: none;
  }
  .back-arrow:hover {
    transform: translateX(-6px) scale(1.1);
  }
  .login-body {
    padding: 35px 40px 25px 40px;
  }
  .form-row {
    display: flex;
    align-items: center;
    margin-bottom: 15px;
    gap: 10px;
  }
  .form-row label {
    width: 140px;
    font-family: 'Oswald', sans-serif;
    font-size: 26px;
    color: #2b1a00;
  }
  .form-row input {
    flex: 1;
    padding: 14px 20px;
    border-radius: 25px;
    border: none;
    background: #f2e7d5;
    font-family: 'Ubuntu Mono', monospace;
    font-size: 20px;
    box-shadow: inset 0 3px 6px rgba(0,0,0,0.15);
  }
  .error-field {
    border: 2px solid red !important;
    background: #ffe5e5 !important;
  }
  .error-text {
    font-family: 'Ubuntu Mono', monospace;
    color: red;
    font-size: 14px;
    margin-left: 150px;
    margin-bottom: 10px;
  }
  .login-btn {
    width: 100%;
    margin-top: 5px;
    padding: 15px;
    border: none;
    border-radius: 20px;
    background: #2f5fa5;
    color: white;
    font-size: 24px;
    font-family: 'Oswald', sans-serif;
    cursor: pointer;
    transition: 0.2s ease;
  }
  .login-btn:hover {
    filter: brightness(1.1);
  }
</style>
{% endblock %}

{% block content %}
<main class="content">
  <div class="login-card">
    <div class="login-header">
      <a class="back-arrow" href="{% url 'login' %}">&#10094;</a>
      ВІДНОВЛЕННЯ ПАРОЛЮ
    </div>
    <div class="login-body">
      <form method="post">
        {% csrf_token %}

        <div class="form-row">
          <label>Email:</label>
          <input type="text" name="email"
       placeholder="Введіть вашу електронну пошту"
       value="{{ data.email|default:'' }}"
       class="{% if errors.email %}error-field{% endif %}">
        </div>

        {% if errors.email %}
          <div class="error-text">{{ errors.email }}</div>
        {% endif %}

        <button type="submit" class="login-btn">НАДІСЛАТИ ЛИСТ</button>
      </form>
    </div>
  </div>
</main>

<script>
function goBack() { window.history.back(); }
</script>
{% endblock %}
